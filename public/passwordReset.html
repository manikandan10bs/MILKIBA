<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - Milkiba</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2e7d32;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #256628;
        }

        #message {
            min-height: 20px;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .back-login {
            text-align: center;
            margin-top: 20px;
        }

        .back-login a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

        .back-login a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="reset-card">

    <h1>MILKIBA</h1>
    <h2>Reset Password</h2>

    <p class="subtitle">
        Enter your registered email to receive a password reset link.
    </p>

    <form id="resetForm">

        <label for="email">Registered Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your registered email"
            required
        >

        <label for="role">Account Type</label>

        <select id="role" required>
            <option value="">Select Account Type</option>
            <option value="buyer">Buyer</option>
            <option value="seller">Seller</option>
            <option value="vendor">Vendor</option>
        </select>

        <label for="reason">Reason / Comment</label>

        <textarea
            id="reason"
            placeholder="Example: I forgot my password"
            required
        ></textarea>

        <button type="submit">
            Send Password Reset Email
        </button>

        <p id="message"></p>

    </form>

    <p class="back-login">
        <a href="./login.html">← Back to Login</a>
    </p>

</div>

<script type="module" src="./js/passwordReset.js"></script>

</body>
</html>
