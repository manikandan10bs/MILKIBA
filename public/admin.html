<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Milkiba</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #222;
        }

        .navbar {
            height: 70px;
            padding: 0 7%;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logout-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            background: #c62828;
            color: white;
            cursor: pointer;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .login-card,
        .dashboard {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .login-card {
            max-width: 450px;
            margin: 50px auto;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .google-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #4285f4;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .google-btn:hover {
            background: #3367d6;
        }

        #loginMessage {
            margin-top: 15px;
            color: #c62828;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .admin-email {
            color: #666;
            font-size: 14px;
        }

        .request-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .request-card h3 {
            margin-bottom: 12px;
        }

        .request-row {
            margin: 7px 0;
        }

        .request-row strong {
            display: inline-block;
            width: 130px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            background: #fff3cd;
            color: #856404;
        }

        .completed {
            background: #d4edda;
            color: #155724;
        }

        .review-btn {
            margin-top: 15px;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #2e7d32;
            color: white;
            cursor: pointer;
        }

        .review-btn:hover {
            background: #256628;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 30px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 0 20px;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .request-row strong {
                display: block;
                margin-bottom: 3px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <a href="./index.html" class="logo" style="text-decoration: none; color: inherit;">MILKIBA ADMIN</a>

    <button id="logoutBtn" class="logout-btn hidden">
        Logout
    </button>

</header>


<main class="container">

    <!-- Google Login -->

    <section id="loginSection" class="login-card">

        <h1>MILKIBA</h1>

        <h2>Admin Login</h2>

        <p class="subtitle">
            Only the authorized Admin Google account can access this page.
        </p>

        <button id="googleLoginBtn" class="google-btn">
            Continue with Google
        </button>

        <p id="loginMessage"></p>

    </section>


    <!-- Admin Dashboard -->

    <section id="dashboardSection" class="dashboard hidden">

        <div class="dashboard-header">

            <div>
                <h1>Password Reset Requests</h1>

                <p class="admin-email">
                    Logged in as:
                    <span id="adminEmail"></span>
                </p>
            </div>

        </div>

        <div id="requestsContainer">

            <p class="empty">
                Loading requests...
            </p>

        </div>

    </section>

</main>


<script type="module" src="./js/admin.js"></script>

</body>
</html>
