<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - Milkiba
    </title>

    <link
        rel="stylesheet"
        href="./css/login.css"
    >

</head>


<body>


    <div class="login-container">


        <div class="login-card">


            <h1>
                MILKIBA
            </h1>


            <h2>
                Welcome Back
            </h2>


            <p class="subtitle">
                Login to your milk marketplace account
            </p>


            <form id="loginForm">


                <label for="email">
                    Email
                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>


                <p id="message"></p>


            </form>


            <!-- PASSWORD RESET -->

            <p class="forgot-password">

                <a href="./passwordReset.html">
                    Forgot Password?
                </a>

            </p>


            <!-- REGISTER -->

            <p class="register-text">

                Don't have an account?

                <a href="./register.html">
                    Create Account
                </a>

            </p>


            <!-- QUICK ACCESS LINKS -->
            <div style="margin-top: 18px; padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; text-align: center;">
                <p style="font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 8px;">Direct Dashboard Access:</p>
                <div style="display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;">
                    <a href="./vendor.html" style="padding: 6px 11px; background: #16803c; color: white; border-radius: 6px; font-size: 12px; font-weight: 700; text-decoration: none;">📊 Vendor Dashboard</a>
                    <a href="./buyer.html" style="padding: 6px 11px; background: #2563eb; color: white; border-radius: 6px; font-size: 12px; font-weight: 700; text-decoration: none;">Buyer</a>
                    <a href="./seller.html" style="padding: 6px 11px; background: #059669; color: white; border-radius: 6px; font-size: 12px; font-weight: 700; text-decoration: none;">Seller</a>
                </div>
            </div>

            <!-- BACK TO HOME -->

            <p class="back-home">

                <a href="./index.html">
                    ← Back to Home
                </a>

            </p>


        </div>


    </div>


    <script
        type="module"
        src="./js/login.js"
    ></script>


</body>

</html>
