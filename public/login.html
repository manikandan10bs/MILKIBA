<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - Milkiba
    </title>

    <link
        rel="stylesheet"
        href="./css/login.css"
    >

</head>


<body>


    <div class="login-container">


        <div class="login-card">


            <h1>
                MILKIBA
            </h1>


            <h2>
                Welcome Back
            </h2>


            <p class="subtitle">
                Login to your milk marketplace account
            </p>


            <form id="loginForm">


                <label for="email">
                    Email
                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>


                <p id="message"></p>


            </form>


            <!-- PASSWORD RESET -->

            <p class="forgot-password">

                <a href="./passwordReset.html">
                    Forgot Password?
                </a>

            </p>


            <!-- REGISTER -->

            <p class="register-text">

                Don't have an account?

                <a href="./register.html">
                    Create Account
                </a>

            </p>


            <!-- BACK TO HOME -->

            <p class="back-home">

                <a href="./index.html">
                    ← Back to Home
                </a>

            </p>


        </div>


    </div>


    <script
        type="module"
        src="./js/login.js"
    ></script>


</body>

</html>
